<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunga Romantis</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to top, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Bunga */
    svg {
      width: 250px;
      height: 250px;
      z-index: 2;
    }

    .flower {
      transform: scale(0);
      animation: bloom 3s ease-out forwards;
      transform-origin: center center;
    }

    @keyframes bloom {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Batang */
    .stem {
      width: 8px;
      height: 200px;
      background: #228B22;
      margin-top: -20px;
      border-radius: 10px;
      position: relative;
      z-index: 1;
    }

    /* Daun */
    .leaf {
      width: 60px;
      height: 30px;
      background: #2ecc71;
      border-radius: 50%;
      position: absolute;
      top: 60px;
    }
    .leaf.left { left: -55px; transform: rotate(-30deg); }
    .leaf.right { right: -55px; transform: rotate(30deg); }

    /* Teks */
    h1 {
      margin-top: 20px;
      font-size: 26px;
      opacity: 0;
      animation: fadeIn 2s ease-in 3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Bulan */
    .moon {
      position: absolute;
      top: 40px;
      right: 60px;
      width: 80px;
      height: 80px;
      background: #f1f5f9;
      border-radius: 50%;
      box-shadow: 0 0 20px #f1f5f9;
      overflow: hidden;
    }
    .moon::after {
      content: "";
      position: absolute;
      top: -10px;
      left: 20px;
      width: 80px;
      height: 80px;
      background: #0f172a;
      border-radius: 50%;
    }

    /* Awan */
    .cloud {
      position: absolute;
      top: 100px;
      background: #e2e8f0;
      border-radius: 50%;
      opacity: 0.8;
      animation: moveCloud 60s linear infinite;
    }
    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: #e2e8f0;
      border-radius: 50%;
    }
    .cloud::before { width: 80px; height: 80px; top: -40px; left: 10px; }
    .cloud::after  { width: 80px; height: 80px; top: -20px; left: 40px; }
    @keyframes moveCloud {
      from { left: -200px; }
      to   { left: 120%; }
    }
    .cloud.small { width: 100px; height: 50px; }
    .cloud.large { width: 160px; height: 80px; top: 150px; animation-duration: 90s; }

    /* Kunang² */
    .firefly {
      position: absolute;
      width: 6px;
      height: 6px;
      background: yellow;
      border-radius: 50%;
      animation: fly 10s infinite ease-in-out alternate;
      box-shadow: 0 0 8px yellow;
    }
    @keyframes fly {
      0%   { transform: translate(0, 0); opacity: 0.2; }
      50%  { transform: translate(100px, -200px); opacity: 1; }
      100% { transform: translate(-100px, -100px); opacity: 0.5; }
    }

    /* Love jatuh */
    .love {
      position: absolute;
      color: white;
      font-size: 20px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Bulan -->
  <div class="moon"></div>

  <!-- Awan -->
  <div class="cloud small"></div>
  <div class="cloud large"></div>

  <!-- Bunga -->
  <svg viewBox="-120 -120 240 240" xmlns="http://www.w3.org/2000/svg" class="flower">
    <g transform="rotate(0)">
      <ellipse cx="0" cy="-60" rx="30" ry="60" fill="#ff6b9a"/>
    </g>
    <g transform="rotate(60)">
      <ellipse cx="0" cy="-60" rx="30" ry="60" fill="#ff85aa"/>
    </g>
    <g transform="rotate(120)">
      <ellipse cx="0" cy="-60" rx="30" ry="60" fill="#ffa3c0"/>
    </g>
    <g transform="rotate(180)">
      <ellipse cx="0" cy="-60" rx="30" ry="60" fill="#ff85aa"/>
    </g>
    <g transform="rotate(240)">
      <ellipse cx="0" cy="-60" rx="30" ry="60" fill="#ffa3c0"/>
    </g>
    <g transform="rotate(300)">
      <ellipse cx="0" cy="-60" rx="30" ry="60" fill="#ff6b9a"/>
    </g>
    <circle cx="0" cy="0" r="25" fill="#ffd166"/>
  </svg>

  <!-- Batang + Daun -->
  <div class="stem">
    <div class="leaf left"></div>
    <div class="leaf right"></div>
  </div>

  <!-- Teks -->
  <h1>i love you moreee babee 🤍</h1>

  <!-- Kunang² -->
  <div class="firefly" style="top: 50%; left: 20%; animation-delay: 0s;"></div>
  <div class="firefly" style="top: 70%; left: 80%; animation-delay: 3s;"></div>
  <div class="firefly" style="top: 40%; left: 60%; animation-delay: 5s;"></div>

  <!-- Love jatuh -->
  <div class="love" style="left:10%; animation-duration:6s;">🤍</div>
  <div class="love" style="left:30%; animation-duration:8s;">🤍</div>
  <div class="love" style="left:50%; animation-duration:5s;">🤍</div>
  <div class="love" style="left:70%; animation-duration:7s;">🤍</div>
  <div class="love" style="left:90%; animation-duration:9s;">🤍</div>
</body>
</html>
